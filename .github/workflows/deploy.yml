name: Deploy Knowledge Tree

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 —— stats 的「最近更新/最近维护日期」取 tech_stack 原件的
      # git author-date，浅克隆拿不到完整提交历史
      - name: Checkout repository (full history)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 全新 checkout 没有生成副本（untracked），先 sync 生成再 --check：
      # 顺带验证同步的确定性（重复执行无漂移）
      - name: Generate & check docs
        run: |
          npm run docs:sync
          npm run docs:check

      - name: Privacy scan
        run: npm run privacy:check

  build:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      # 显式构建（替代 withastro/action）：构建在 prebuild 钩子里跑 sync，
      # 同样需要完整 git 历史计算「最近维护」日期，产物上传 pages artifact
      - name: Checkout repository (full history)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Astro website
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
